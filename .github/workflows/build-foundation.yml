name: Build foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold_build:
        description: Disable Conan cache restore/save; use a fresh job-owned home
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.environment }}-${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    # Explicit hosted hard limit. The wrapper's 60s quiet checkpoint is only liveness inspection.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            environment: ubuntu-ci
            profile: linux-x86_64-clang
            config: Debug
          - runner: ubuntu-24.04
            environment: ubuntu-ci
            profile: linux-x86_64-clang
            config: Release
          - runner: windows-2022
            environment: windows-ci
            profile: windows-x86_64-clangcl
            config: Debug
          - runner: windows-2022
            environment: windows-ci
            profile: windows-x86_64-clangcl
            config: Release
    defaults:
      run:
        shell: pwsh
    env:
      VEYR_CI_ENVIRONMENT: ${{ matrix.environment }}
      VEYR_CI_PROFILE: ${{ matrix.profile }}
      VEYR_CI_CONFIG: ${{ matrix.config }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'

    steps:
      - name: Checkout reviewed inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap observation only (installed runner tools; no policy promotion)
        env:
          # Outside checkout; unique to this native job/attempt. No shared cache mutation or purge.
          CONAN_HOME: ${{ runner.temp }}/veyr-conan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.config }}
        run: |
          "CONAN_HOME=$env:CONAN_HOME" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force .veyr-dev/ci | Out-Null
          @{
            environment = $env:VEYR_CI_ENVIRONMENT
            profile = $env:VEYR_CI_PROFILE
            configuration = $env:VEYR_CI_CONFIG
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            commit = $env:GITHUB_SHA
            conan_home = $env:CONAN_HOME
            acceptance = 'pending independent identity review; no native/package readiness'
          } | ConvertTo-Json | Tee-Object .veyr-dev/ci/runner.json
          foreach ($tool in @('python', 'cmake', 'ninja', 'git', 'clang', 'clang++', 'clang-cl')) {
            $found = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $found) { "${tool}: missing" | Tee-Object -Append .veyr-dev/ci/installed-tools.txt; continue }
            "$tool path=$($found.Source)" | Tee-Object -Append .veyr-dev/ci/installed-tools.txt
            & $found.Source --version 2>&1 | Tee-Object -Append .veyr-dev/ci/installed-tools.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($IsLinux) {
            Get-Content /etc/os-release | Tee-Object .veyr-dev/ci/os-release.txt
            foreach ($tool in @('gcc', 'g++', 'ldd', 'ld')) {
              & $tool --version 2>&1 | Tee-Object -Append .veyr-dev/ci/native-tools.txt
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            & gcc -print-libgcc-file-name | Tee-Object -Append .veyr-dev/ci/native-tools.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & g++ -print-file-name=libstdc++.so | Tee-Object -Append .veyr-dev/ci/native-tools.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            & $vswhere -all -format json -utf8 | Tee-Object .veyr-dev/ci/vs-installations.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Installed VS candidates are observations, not selected CRT/SDK/linker identities.
          }

      - name: Require independently reviewed CI policy before tool/package setup
        id: policy
        run: |
          $baseline = Get-Content scripts/devtools/baseline.json -Raw | ConvertFrom-Json
          $entry = $baseline.ci_environments.($env:VEYR_CI_ENVIRONMENT)
          if ($entry.status -notin @('selected', 'reviewed')) {
            python -B scripts/dev.py doctor --json --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/doctor.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            throw 'Unexpected pending-policy acceptance. Stop before setup; request owner identity review.'
          }
          if ($entry.runner -ne '${{ matrix.runner }}' -or $entry.profile -ne $env:VEYR_CI_PROFILE) {
            throw 'Reviewed CI policy does not select this runner/profile. No developer-policy fallback.'
          }
          foreach ($tool in @('python', 'cmake', 'clang')) {
            if ($entry.tools.$tool -notmatch '^\d+\.\d+\.\d+$') { throw "Missing exact CI $tool identity" }
          }
          "python=$($entry.tools.python)" >> $env:GITHUB_OUTPUT
          if (-not $env:ImageVersion) { throw 'Missing observed runner image version for cache isolation' }
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          # Expected policy is evidence only after the strict native doctor has matched actual values.
          $entry | ConvertTo-Json -Depth 10 | Set-Content .veyr-dev/ci/expected-policy.json

      - name: Select exact reviewed base Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.policy.outputs.python }}
          architecture: x64
          check-latest: false

      - name: Set up conventional isolated CMake/Ninja prerequisites and reviewed native environment
        run: |
          $baseline = Get-Content scripts/devtools/baseline.json -Raw | ConvertFrom-Json
          $entry = $baseline.ci_environments.($env:VEYR_CI_ENVIRONMENT)
          $ninja = $baseline.tools.ninja
          if ($entry.tools.ninja) { $ninja = $entry.tools.ninja }
          $env:PIP_CONFIG_FILE = if ($IsWindows) { 'NUL' } else { '/dev/null' }
          python -I -m venv .veyr-dev/tools/ci-prerequisites
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { '.veyr-dev/tools/ci-prerequisites/Scripts' } else { '.veyr-dev/tools/ci-prerequisites/bin' }
          $toolPython = Join-Path $bin $(if ($IsWindows) { 'python.exe' } else { 'python' })
          & $toolPython -I -m pip --isolated --require-virtualenv --disable-pip-version-check install --index-url https://pypi.org/simple --no-cache-dir --only-binary=:all: "cmake==$($entry.tools.cmake)" "ninja==$ninja"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolPython -I -m pip --isolated --require-virtualenv --disable-pip-version-check check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path $bin).Path >> $env:GITHUB_PATH
          # Host Clang/GCC or VS/SDK must match separately reviewed installed runner identities.
          # No backend SDK download, profile detect, automatic drift acceptance or distro installer.
          if ($IsWindows) {
            $module = Join-Path $entry.paths.vs_root 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll'
            Import-Module $module
            Enter-VsDevShell -VsInstallPath $entry.paths.vs_root -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -vcvars_ver=$($entry.native.vctools) -winsdk=$($entry.native.sdk)"
            foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if (-not $value -or $value.Contains("`n") -or $value.Contains("`r")) { throw "Invalid developer environment $name" }
              "$name=$value" >> $env:GITHUB_ENV
            }
          }

      - name: Bootstrap project-owned Conan CLI only
        run: |
          python -B scripts/dev.py setup --tools-only --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/tools-only.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Strict read-only prerequisite doctor
        id: doctor
        run: |
          python -B scripts/dev.py doctor --json --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/doctor.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content .veyr-dev/ci/doctor.json -Raw | ConvertFrom-Json
          "conan=$($report.selection.conan_executable)" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path $report.selection.lockfile -PathType Leaf)) {
            throw 'Required tracked native Conan lock missing; owner-reviewed lock initialization is a separate gate.'
          }

      - name: Restore/save Conan-owned cache only (optimization)
        if: ${{ success() && !inputs.cold_build }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ env.CONAN_HOME }}
          key: conan-${{ runner.os }}-${{ runner.arch }}-${{ matrix.environment }}-${{ matrix.config }}-${{ steps.policy.outputs.image }}-${{ hashFiles('scripts/devtools/baseline.json', 'conan/profiles/**', 'conan/recipes/**', 'conan/locks/**', 'conanfile.py', 'CMakePresets.json') }}
          enableCrossOsArchive: false

      - name: Explicit Conan dependency setup (downloads/source builds allowed)
        run: |
          $start = Get-Date
          python -B scripts/dev.py setup --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/setup.log
          $code = $LASTEXITCODE
          "setup_exit=$code elapsed_seconds=$(((Get-Date) - $start).TotalSeconds) cold_build=${{ inputs.cold_build }}" | Set-Content .veyr-dev/ci/setup-timing.txt
          # Runner memory/disk peaks are not measured by this wall-clock record; remain evidence gaps.
          if ($code -ne 0) { exit $code }

      - name: Native cache-only configure
        run: |
          python -B scripts/dev.py configure --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native incremental build
        run: |
          python -B scripts/dev.py build --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native test
        run: |
          python -B scripts/dev.py test --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native verify
        run: |
          python -B scripts/dev.py verify --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/verify.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Foundation prepared native acceptance
        run: |
          python -B scripts/check_foundation.py --case prepared --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/foundation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Foundation acquisition-disabled empty-cache rejection
        run: |
          python -B scripts/check_foundation.py --case offline --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/offline.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload observations, logs and native records (including failed bootstrap)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-${{ matrix.environment }}-${{ matrix.config }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .veyr-dev/ci/
            build/**/compile_commands.json
            build/**/results.json
            build/**/Testing/Temporary/LastTest.log
            build/**/offline-rejection.log
