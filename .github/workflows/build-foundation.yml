name: Build foundation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cold_build:
        description: Disable Conan cache restore/save; use a fresh job-owned home
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.environment }}-${{ matrix.config }}
    runs-on: ${{ matrix.runner }}
    # Explicit hosted hard limit. The wrapper's 60s quiet checkpoint is only liveness inspection.
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: ubuntu-24.04
            environment: ubuntu-ci
            profile: linux-x86_64-clang
            config: Debug
          - runner: ubuntu-24.04
            environment: ubuntu-ci
            profile: linux-x86_64-clang
            config: Release
          - runner: windows-2022
            environment: windows-ci
            profile: windows-x86_64-clangcl
            config: Debug
          - runner: windows-2022
            environment: windows-ci
            profile: windows-x86_64-clangcl
            config: Release
    defaults:
      run:
        shell: pwsh
    env:
      VEYR_CI_ENVIRONMENT: ${{ matrix.environment }}
      VEYR_CI_PROFILE: ${{ matrix.profile }}
      VEYR_CI_CONFIG: ${{ matrix.config }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONNOUSERSITE: '1'
      # Reviewed toolchain candidates do not authorize any CI installation/package/native work.
      VEYR_CI_EXECUTION_AUTHORIZED: 'true'

    steps:
      - name: Checkout reviewed inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap observation only (installed runner tools; no policy promotion)
        env:
          # Outside checkout; unique to this native job/attempt. No shared cache mutation or purge.
          CONAN_HOME: ${{ runner.temp }}/veyr-conan-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.environment }}-${{ matrix.config }}
        run: |
          "CONAN_HOME=$env:CONAN_HOME" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force .veyr-dev/ci | Out-Null
          @{
            environment = $env:VEYR_CI_ENVIRONMENT
            profile = $env:VEYR_CI_PROFILE
            configuration = $env:VEYR_CI_CONFIG
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            commit = $env:GITHUB_SHA
            conan_home = $env:CONAN_HOME
            acceptance = 'pending independent identity review; no native/package readiness'
          } | ConvertTo-Json | Tee-Object .veyr-dev/ci/runner.json
          foreach ($tool in @('python', 'cmake', 'ninja', 'git', 'clang', 'clang++', 'clang-cl')) {
            $found = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $found) { "${tool}: missing" | Tee-Object -Append .veyr-dev/ci/installed-tools.txt; continue }
            "$tool path=$($found.Source)" | Tee-Object -Append .veyr-dev/ci/installed-tools.txt
            & $found.Source --version 2>&1 | Tee-Object -Append .veyr-dev/ci/installed-tools.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if ($IsLinux) {
            Get-Content /etc/os-release | Tee-Object .veyr-dev/ci/os-release.txt
            foreach ($tool in @('gcc', 'g++', 'ldd', 'ld')) {
              & $tool --version 2>&1 | Tee-Object -Append .veyr-dev/ci/native-tools.txt
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
            & gcc -print-libgcc-file-name | Tee-Object -Append .veyr-dev/ci/native-tools.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & g++ '-print-file-name=libstdc++.so' | Tee-Object -Append .veyr-dev/ci/native-tools.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Query/dry-run flags only: no frontend, assembler or linker is executed by -###.
            # Preserve executable resolution order; extract Source only after selecting one match.
            $clangCpp = (Get-Command clang++ -CommandType Application -All -ErrorAction Stop | Select-Object -First 1).Source
            $gxx = (Get-Command g++ -CommandType Application -All -ErrorAction Stop | Select-Object -First 1).Source
            "selected_clang_cpp_path=$clangCpp" | Tee-Object -Append .veyr-dev/ci/installed-tools.txt
            "selected_gxx_path=$gxx" | Tee-Object -Append .veyr-dev/ci/native-tools.txt
            & $clangCpp '-print-search-dirs' 2>&1 | Tee-Object .veyr-dev/ci/compiler-search-paths.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $gxx '-print-search-dirs' 2>&1 | Tee-Object -Append .veyr-dev/ci/compiler-search-paths.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $trace = & $clangCpp '-###' '-x' 'c++' '/dev/null' 2>&1
            if ($LASTEXITCODE -ne 0) { $trace | Write-Output; exit $LASTEXITCODE }
            $trace | Tee-Object .veyr-dev/ci/clang-default-driver.txt
            $headerRoots = [regex]::Matches(($trace -join "`n"), '"-internal-(?:externc-)?isystem" "([^"]+)"') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            foreach ($root in $headerRoots) {
              "header_search_root=$root exists=$(Test-Path -LiteralPath $root -PathType Container)" | Tee-Object -Append .veyr-dev/ci/stdlib-headers.txt
              $configHeader = Join-Path $root 'bits/c++config.h'
              if (Test-Path -LiteralPath $configHeader -PathType Leaf) {
                $resolvedHeader = & readlink '-f' $configHeader
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                "resolved_config_header=$resolvedHeader" | Tee-Object -Append .veyr-dev/ci/stdlib-headers.txt
                Get-FileHash -LiteralPath $configHeader -Algorithm SHA256 | Format-List | Out-String | Tee-Object -Append .veyr-dev/ci/stdlib-headers.txt
                Get-Content -LiteralPath $configHeader | Select-String '^#define\s+(?:_GLIBCXX_RELEASE|__GLIBCXX__|_GLIBCXX_USE_CXX11_ABI)\b' |
                  ForEach-Object { $_.Line } | Tee-Object -Append .veyr-dev/ci/stdlib-headers.txt
                & dpkg-query '-S' $resolvedHeader 2>&1 | Tee-Object -Append .veyr-dev/ci/stdlib-headers.txt
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
            $libraries = @()
            foreach ($driver in @($clangCpp, $gxx)) {
              $library = & $driver '-print-file-name=libstdc++.so'
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              "driver=$driver reported_libstdcxx=$library" | Tee-Object -Append .veyr-dev/ci/stdlib-runtime.txt
              if (-not (Test-Path -LiteralPath $library -PathType Leaf)) {
                'Resolved runtime unavailable; identity remains pending.' | Tee-Object -Append .veyr-dev/ci/stdlib-runtime.txt
                continue
              }
              $resolved = & readlink '-f' $library
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              "resolved_libstdcxx=$resolved" | Tee-Object -Append .veyr-dev/ci/stdlib-runtime.txt
              $libraries += $resolved
            }
            foreach ($library in ($libraries | Sort-Object -Unique)) {
              Get-FileHash -LiteralPath $library -Algorithm SHA256 | Format-List | Out-String | Tee-Object -Append .veyr-dev/ci/stdlib-runtime.txt
              & dpkg-query '-S' $library 2>&1 | Tee-Object -Append .veyr-dev/ci/stdlib-runtime.txt
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $versions = & readelf '--version-info' $library 2>&1
              if ($LASTEXITCODE -ne 0) { $versions | Write-Output; exit $LASTEXITCODE }
              $versions | Select-String 'Name: (?:GLIBCXX|CXXABI)_' |
                ForEach-Object { $_.Line } | Tee-Object -Append .veyr-dev/ci/stdlib-runtime.txt
            }
            & dpkg-query '--show' '--showformat=${binary:Package} ${Version}\n' 'libstdc++6' 2>&1 | Tee-Object -Append .veyr-dev/ci/stdlib-runtime.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $linker = & $clangCpp '-print-prog-name=ld'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "clang_reported_linker=$linker" | Tee-Object .veyr-dev/ci/selected-linker.txt
            $linkerPath = (Get-Command $linker -CommandType Application -All -ErrorAction Stop | Select-Object -First 1).Source
            "selected_linker_path=$linkerPath" | Tee-Object -Append .veyr-dev/ci/selected-linker.txt
            $resolvedLinker = & readlink '-f' $linkerPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "linker_path=$linkerPath resolved_linker=$resolvedLinker" | Tee-Object -Append .veyr-dev/ci/selected-linker.txt
            & $linkerPath '--version' 2>&1 | Tee-Object -Append .veyr-dev/ci/selected-linker.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Additional explicit GCC-13 observations; keep the default GCC-14 trace/files intact.
            # These query/dry-run flags do not compile, link, or select CI/profile policy.
            $gcc13Root = '/usr/lib/gcc/x86_64-linux-gnu/13'
            $gcc13Flag = "--gcc-install-dir=$gcc13Root"
            if (-not (Test-Path -LiteralPath $gcc13Root -PathType Container)) {
              throw "Explicit GCC-13 observation root missing: $gcc13Root. No fallback selection."
            }
            "clang_cpp_path=$clangCpp gcc_selection=$gcc13Flag policy=pending" | Tee-Object .veyr-dev/ci/linux-gcc13-search-paths.txt
            & $clangCpp $gcc13Flag '--version' 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-search-paths.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $clangCpp $gcc13Flag '-print-search-dirs' 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-search-paths.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $clangCpp $gcc13Flag '-print-libgcc-file-name' 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-search-paths.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $gcc13Trace = & $clangCpp $gcc13Flag '-###' '-std=c++23' '-x' 'c++' '/dev/null' 2>&1
            if ($LASTEXITCODE -ne 0) { $gcc13Trace | Write-Output; exit $LASTEXITCODE }
            $gcc13Trace | Tee-Object .veyr-dev/ci/linux-gcc13-driver.txt
            $gcc13HeaderRoots = [regex]::Matches(($gcc13Trace -join "`n"), '"-internal-(?:externc-)?isystem" "([^"]+)"') |
              ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
            foreach ($root in $gcc13HeaderRoots) {
              "header_search_root=$root exists=$(Test-Path -LiteralPath $root -PathType Container)" | Tee-Object -Append .veyr-dev/ci/linux-gcc13-headers.txt
              $configHeader = Join-Path $root 'bits/c++config.h'
              if (Test-Path -LiteralPath $configHeader -PathType Leaf) {
                $resolvedHeader = & readlink '-f' $configHeader
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                "resolved_config_header=$resolvedHeader" | Tee-Object -Append .veyr-dev/ci/linux-gcc13-headers.txt
                Get-FileHash -LiteralPath $configHeader -Algorithm SHA256 | Format-List | Out-String | Tee-Object -Append .veyr-dev/ci/linux-gcc13-headers.txt
                # Capture '# define' as well as '#define'; these are raw conditional definitions,
                # not evidence of an effective preprocessed ABI or native compatibility.
                $definitions = @(Get-Content -LiteralPath $configHeader | Select-String '^\s*#\s*define\s+(?:_GLIBCXX_RELEASE|__GLIBCXX__|_GLIBCXX_USE_CXX11_ABI)\b' |
                  ForEach-Object { $_.Line })
                $definitions | Tee-Object -Append .veyr-dev/ci/linux-gcc13-headers.txt
                if (-not ($definitions -match '_GLIBCXX_USE_CXX11_ABI\b')) {
                  '_GLIBCXX_USE_CXX11_ABI: not observed in raw configuration header' | Tee-Object -Append .veyr-dev/ci/linux-gcc13-headers.txt
                }
                & dpkg-query '-S' $resolvedHeader 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-headers.txt
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
            & dpkg-query '--show' '--showformat=${binary:Package} ${Version}\n' 'libstdc++-13-dev' 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-headers.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $gcc13Library = & $clangCpp $gcc13Flag '-print-file-name=libstdc++.so'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "driver=$clangCpp gcc_selection=$gcc13Flag reported_libstdcxx=$gcc13Library" | Tee-Object .veyr-dev/ci/linux-gcc13-runtime.txt
            if (Test-Path -LiteralPath $gcc13Library -PathType Leaf) {
              $gcc13ResolvedLibrary = & readlink '-f' $gcc13Library
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              "resolved_libstdcxx=$gcc13ResolvedLibrary" | Tee-Object -Append .veyr-dev/ci/linux-gcc13-runtime.txt
              Get-FileHash -LiteralPath $gcc13ResolvedLibrary -Algorithm SHA256 | Format-List | Out-String | Tee-Object -Append .veyr-dev/ci/linux-gcc13-runtime.txt
              & dpkg-query '-S' $gcc13ResolvedLibrary 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-runtime.txt
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              $gcc13Versions = & readelf '--version-info' $gcc13ResolvedLibrary 2>&1
              if ($LASTEXITCODE -ne 0) { $gcc13Versions | Write-Output; exit $LASTEXITCODE }
              $gcc13Versions | Select-String 'Name: (?:GLIBCXX|CXXABI)_' |
                ForEach-Object { $_.Line } | Tee-Object -Append .veyr-dev/ci/linux-gcc13-runtime.txt
            } else {
              'Resolved runtime unavailable; identity remains pending.' | Tee-Object -Append .veyr-dev/ci/linux-gcc13-runtime.txt
            }
            & dpkg-query '--show' '--showformat=${binary:Package} ${Version}\n' 'libstdc++6' 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-runtime.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $gcc13Linker = & $clangCpp $gcc13Flag '-print-prog-name=ld'
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "gcc_selection=$gcc13Flag clang_reported_linker=$gcc13Linker" | Tee-Object .veyr-dev/ci/linux-gcc13-linker.txt
            $gcc13LinkerPath = (Get-Command $gcc13Linker -CommandType Application -All -ErrorAction Stop | Select-Object -First 1).Source
            $gcc13ResolvedLinker = & readlink '-f' $gcc13LinkerPath
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "selected_linker_path=$gcc13LinkerPath resolved_linker=$gcc13ResolvedLinker" | Tee-Object -Append .veyr-dev/ci/linux-gcc13-linker.txt
            & $gcc13LinkerPath '--version' 2>&1 | Tee-Object -Append .veyr-dev/ci/linux-gcc13-linker.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            & $vswhere -all -format json -utf8 | Tee-Object .veyr-dev/ci/vs-installations.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # Inspect the one complete installed VS shell's defaults, without selecting CI policy.
            # Its environment is process-local to this observation step; never export it via GITHUB_ENV.
            $installations = @(Get-Content .veyr-dev/ci/vs-installations.json -Raw | ConvertFrom-Json |
              Where-Object { $_.isComplete -and $_.isLaunchable })
            if ($installations.Count -ne 1) { throw 'VS observation ambiguous: expected one complete installation; review vs-installations.json.' }
            $installation = $installations[0]
            $module = Join-Path $installation.installationPath 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll'
            Import-Module $module -ErrorAction Stop
            Enter-VsDevShell -VsInstallPath $installation.installationPath -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64' -ErrorAction Stop
            $shell = [ordered]@{
              purpose = 'Observed installed shell defaults only; CI policy pending/unselected; no environment export'
              vs_installation_version = $installation.installationVersion
              vs_installation_path = $installation.installationPath
              shell_module = $module
            }
            foreach ($name in @('VSINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'VCToolsRedistDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'WindowsSDKLibVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_VER', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH', 'PATH', 'INCLUDE', 'LIB', 'LIBPATH')) {
              $shell[$name] = [Environment]::GetEnvironmentVariable($name)
            }
            $shell | ConvertTo-Json -Depth 5 | Tee-Object .veyr-dev/ci/windows-developer-shell.json
            foreach ($tool in @('cl', 'link', 'clang', 'clang++', 'clang-cl')) {
              $found = Get-Command $tool -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($null -eq $found) { "${tool}: missing in observed developer shell" | Tee-Object -Append .veyr-dev/ci/windows-selected-tools.txt; continue }
              $item = Get-Item -LiteralPath $found.Source
              "$tool path=$($item.FullName) file_version=$($item.VersionInfo.FileVersion) product_version=$($item.VersionInfo.ProductVersion)" | Tee-Object -Append .veyr-dev/ci/windows-selected-tools.txt
              if ($tool -like 'clang*') {
                & $found.Source '--version' 2>&1 | Tee-Object -Append .veyr-dev/ci/windows-selected-tools.txt
                if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              }
            }
            if (-not $env:VCToolsInstallDir -or -not $env:WindowsSdkDir -or -not $env:WindowsSDKVersion -or -not $env:UniversalCRTSdkDir -or -not $env:UCRTVersion) {
              throw 'Observed developer shell has incomplete VC/SDK/UCRT identity; review windows-developer-shell.json.'
            }
            $sdkVersion = $env:WindowsSDKVersion.TrimEnd([char[]]'\/')
            $ucrtVersion = $env:UCRTVersion.TrimEnd([char[]]'\/')
            $crtHeader = Join-Path $env:VCToolsInstallDir 'include/crtversion.h'
            if (Test-Path -LiteralPath $crtHeader -PathType Leaf) {
              Get-Content -LiteralPath $crtHeader | Select-String '^#define\s+_VC_CRT_(?:MAJOR|MINOR|BUILD|RBUILD)_VERSION\b' |
                ForEach-Object { $_.Line } | Tee-Object .veyr-dev/ci/windows-crt-version.txt
            }
            $runtimeFiles = @(
              $crtHeader
              (Join-Path $env:VCToolsInstallDir 'lib/x64/msvcrt.lib')
              (Join-Path $env:VCToolsInstallDir 'lib/x64/msvcrtd.lib')
              (Join-Path $env:WindowsSdkDir "Include/$sdkVersion/um/Windows.h")
              (Join-Path $env:WindowsSdkDir "Lib/$sdkVersion/um/x64/kernel32.lib")
              (Join-Path $env:UniversalCRTSdkDir "Include/$ucrtVersion/ucrt/corecrt.h")
              (Join-Path $env:UniversalCRTSdkDir "Lib/$ucrtVersion/ucrt/x64/ucrt.lib")
              (Join-Path $env:UniversalCRTSdkDir "Lib/$ucrtVersion/ucrt/x64/ucrtd.lib")
              (Join-Path $env:SystemRoot 'System32/ucrtbase.dll')
            )
            foreach ($path in $runtimeFiles) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { "missing=$path" | Tee-Object -Append .veyr-dev/ci/windows-runtime-files.txt; continue }
              $item = Get-Item -LiteralPath $path
              "path=$($item.FullName) file_version=$($item.VersionInfo.FileVersion) product_version=$($item.VersionInfo.ProductVersion)" | Tee-Object -Append .veyr-dev/ci/windows-runtime-files.txt
              Get-FileHash -LiteralPath $path -Algorithm SHA256 | Format-List | Out-String | Tee-Object -Append .veyr-dev/ci/windows-runtime-files.txt
            }
            # ucrtbase.dll is the observed OS runtime, distinct from selected SDK/UCRT link inputs.
            # Observe standalone LLVM in the same DevShell, using absolute paths only.
            # Preserve bundled LLVM observations and all VC/SDK variables; do not export a selection.
            'Absolute standalone compiler queries in observed DevShell; CI policy remains pending.' | Tee-Object .veyr-dev/ci/windows-standalone-tools.txt
            foreach ($path in @('C:\Program Files\LLVM\bin\clang.exe', 'C:\Program Files\LLVM\bin\clang++.exe', 'C:\Program Files\LLVM\bin\clang-cl.exe')) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
                throw "Standalone LLVM executable missing: $path. No PATH fallback."
              }
              $item = Get-Item -LiteralPath $path
              "path=$($item.FullName) file_version=$($item.VersionInfo.FileVersion) product_version=$($item.VersionInfo.ProductVersion)" | Tee-Object -Append .veyr-dev/ci/windows-standalone-tools.txt
              $standaloneVersion = & $item.FullName '--version' 2>&1
              $standaloneExit = $LASTEXITCODE
              $standaloneVersion | Tee-Object -Append .veyr-dev/ci/windows-standalone-tools.txt
              if ($standaloneExit -ne 0) { exit $standaloneExit }
              $standaloneBanner = $standaloneVersion -join "`n"
              if ($standaloneBanner -notmatch '(?m)^clang version 20\.1\.8(?:\s|$)' -or
                  $standaloneBanner -notmatch '(?m)^Target:\s*x86_64-pc-windows-msvc\s*$') {
                throw "Standalone observation mismatch for ${path}: expected Clang 20.1.8 / x86_64-pc-windows-msvc; see recorded banner. CI policy remains pending."
              }
            }
            # Record and compare the retained shell environment, including native linker resolution.
            foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'VCToolsRedistDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'WindowsSDKLibVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VSCMD_VER', 'VSCMD_ARG_HOST_ARCH', 'VSCMD_ARG_TGT_ARCH')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              "$name=$value" | Tee-Object -Append .veyr-dev/ci/windows-standalone-tools.txt
              if ($value -cne $shell[$name]) { throw "DevShell observation environment changed: $name. Stop without policy selection." }
            }
            $retainedLinker = (Get-Command link -CommandType Application -All -ErrorAction Stop | Select-Object -First 1).Source
            "retained_linker_path=$retainedLinker" | Tee-Object -Append .veyr-dev/ci/windows-standalone-tools.txt
          }

      - name: Require independently reviewed CI policy before tool/package setup
        id: policy
        run: |
          if ($env:VEYR_CI_EXECUTION_AUTHORIZED -ne 'true') {
            throw 'CI bootstrap/package/native execution requires separate owner authorization; reviewed toolchain candidates are policy only.'
          }
          $baseline = Get-Content scripts/devtools/baseline.json -Raw | ConvertFrom-Json
          $entry = $baseline.ci_environments.($env:VEYR_CI_ENVIRONMENT)
          if ($entry.status -notin @('selected', 'reviewed')) {
            python -B scripts/dev.py doctor --json --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/doctor.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            throw 'Unexpected pending-policy acceptance. Stop before setup; request owner identity review.'
          }
          if ($entry.runner -ne '${{ matrix.runner }}' -or $entry.profile -ne $env:VEYR_CI_PROFILE) {
            throw 'Reviewed CI policy does not select this runner/profile. No developer-policy fallback.'
          }
          foreach ($tool in @('python', 'cmake', 'clang')) {
            if ($entry.tools.$tool -notmatch '^\d+\.\d+\.\d+$') { throw "Missing exact CI $tool identity" }
          }
          "python=$($entry.tools.python)" >> $env:GITHUB_OUTPUT
          if (-not $env:ImageVersion) { throw 'Missing observed runner image version for cache isolation' }
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
          # Expected policy is evidence only after the strict native doctor has matched actual values.
          $entry | ConvertTo-Json -Depth 10 | Set-Content .veyr-dev/ci/expected-policy.json

      - name: Select exact reviewed base Python
        id: base_python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ steps.policy.outputs.python }}
          architecture: x64
          check-latest: false

      - name: Set up conventional isolated CMake/Ninja prerequisites and reviewed native environment
        env:
          VEYR_BASE_PYTHON: ${{ steps.base_python.outputs.python-path }}
        run: |
          if (-not $env:VEYR_BASE_PYTHON -or
              -not [System.IO.Path]::IsPathFullyQualified($env:VEYR_BASE_PYTHON) -or
              $env:VEYR_BASE_PYTHON.Contains("`n") -or $env:VEYR_BASE_PYTHON.Contains("`r") -or
              -not (Test-Path -LiteralPath $env:VEYR_BASE_PYTHON -PathType Leaf)) {
            throw 'setup-python must supply an existing absolute base Python executable.'
          }
          Write-Output "Reviewed base Python executable: $env:VEYR_BASE_PYTHON"
          "VEYR_BASE_PYTHON=$env:VEYR_BASE_PYTHON" >> $env:GITHUB_ENV
          $baseline = Get-Content scripts/devtools/baseline.json -Raw | ConvertFrom-Json
          $entry = $baseline.ci_environments.($env:VEYR_CI_ENVIRONMENT)
          $ninja = $baseline.tools.ninja
          if ($entry.tools.ninja) { $ninja = $entry.tools.ninja }
          $env:PIP_CONFIG_FILE = if ($IsWindows) { 'NUL' } else { '/dev/null' }
          & $env:VEYR_BASE_PYTHON -I -m venv .veyr-dev/tools/ci-prerequisites
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = if ($IsWindows) { '.veyr-dev/tools/ci-prerequisites/Scripts' } else { '.veyr-dev/tools/ci-prerequisites/bin' }
          $toolPython = Join-Path $bin $(if ($IsWindows) { 'python.exe' } else { 'python' })
          & $toolPython -I -m pip --isolated --require-virtualenv --disable-pip-version-check install --index-url https://pypi.org/simple --no-cache-dir --only-binary=:all: "cmake==$($entry.tools.cmake)" "ninja==$ninja"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $toolPython -I -m pip --isolated --require-virtualenv --disable-pip-version-check check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Resolve-Path $bin).Path >> $env:GITHUB_PATH
          # Host Clang/GCC or VS/SDK must match separately reviewed installed runner identities.
          # No backend SDK download, profile detect, automatic drift acceptance or distro installer.
          if ($IsWindows) {
            $module = Join-Path $entry.paths.vs_root 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll'
            Import-Module $module
            Enter-VsDevShell -VsInstallPath $entry.paths.vs_root -SkipAutomaticLocation -DevCmdArguments "-arch=x64 -host_arch=x64 -vcvars_ver=$($entry.native.vctools) -winsdk=$($entry.native.sdk)"
            # VC/CRT/SDK/linker come from DevShell; compiler identity is standalone LLVM only.
            $standaloneBin = 'C:\Program Files\LLVM\bin'
            $expectedClangCl = Join-Path $standaloneBin 'clang-cl.exe'
            if ($entry.paths.c_compiler -ne $expectedClangCl -or $entry.paths.cpp_compiler -ne $expectedClangCl) {
              throw 'Reviewed Windows compiler inputs must select absolute standalone clang-cl.exe paths.'
            }
            foreach ($tool in @('clang.exe', 'clang++.exe', 'clang-cl.exe')) {
              $executable = Join-Path $standaloneBin $tool
              $banner = & $executable '--version' 2>&1
              if ($LASTEXITCODE -ne 0) { $banner | Write-Output; exit $LASTEXITCODE }
              $text = $banner -join "`n"
              if ($text -notmatch '(?m)^clang version 20\.1\.8(?:\s|$)' -or
                  $text -notmatch '(?m)^Target:\s*x86_64-pc-windows-msvc\s*$') {
                $banner | Write-Output
                throw "Standalone compiler drift at $executable; no bundled LLVM fallback."
              }
            }
            # Job-local precedence also prevents incidental PATH lookups from selecting bundled 19.1.5.
            $env:PATH = "$standaloneBin;$env:PATH"
            foreach ($name in @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VSINSTALLDIR', 'VCToolsInstallDir', 'VCToolsVersion', 'WindowsSdkDir', 'WindowsSDKVersion')) {
              $value = [Environment]::GetEnvironmentVariable($name)
              if (-not $value -or $value.Contains("`n") -or $value.Contains("`r")) { throw "Invalid developer environment $name" }
              "$name=$value" >> $env:GITHUB_ENV
            }
          }

      - name: Bootstrap project-owned Conan CLI only
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/dev.py setup --tools-only --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/tools-only.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Strict read-only prerequisite doctor
        id: doctor
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/dev.py doctor --json --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/doctor.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $report = Get-Content .veyr-dev/ci/doctor.json -Raw | ConvertFrom-Json
          "conan=$($report.selection.conan_executable)" >> $env:GITHUB_OUTPUT
          if (-not (Test-Path $report.selection.lockfile -PathType Leaf)) {
            throw 'Required tracked native Conan lock missing; owner-reviewed lock initialization is a separate gate.'
          }

      - name: Compute Conan cache compatibility and snapshot keys
        id: cache_keys
        if: ${{ success() && !inputs.cold_build }}
        env:
          VEYR_CACHE_IMAGE: ${{ steps.policy.outputs.image }}
          VEYR_DEPENDENCY_INPUT_HASH: ${{ hashFiles(format('conan/profiles/{0}', matrix.profile), 'conan/profiles/debug', 'conan/profiles/release', format('conan/locks/{0}-*.lock', matrix.profile), 'conan/recipes/llvm/**', 'conanfile.py') }}
        run: |
          $keyScript = @'
          import hashlib
          import json
          import os
          from pathlib import Path

          baseline = json.loads(Path("scripts/devtools/baseline.json").read_text(encoding="utf-8"))
          environment = os.environ["VEYR_CI_ENVIRONMENT"]
          profile = os.environ["VEYR_CI_PROFILE"]
          entry = baseline["ci_environments"][environment]
          toolchain = {
              "os": entry["os"], "arch": entry["arch"], "target": entry["target"],
              "tools": {name: entry["tools"].get(name, baseline["tools"].get(name))
                        for name in ("python", "conan", "cmake", "ninja", "clang")},
              "native": entry["native"], "paths": entry["paths"],
              "llvm": baseline["backend"]["llvm"],
          }
          policy_hash = hashlib.sha256(json.dumps(toolchain, sort_keys=True).encode()).hexdigest()
          dependency_hash = os.environ["VEYR_DEPENDENCY_INPUT_HASH"]
          if not dependency_hash:
              raise SystemExit("Missing Conan dependency-input hash; no broader cache fallback.")
          prefix = (
              f"conan-v2-{os.environ['RUNNER_OS']}-{os.environ['RUNNER_ARCH']}-"
              f"{environment}-{profile}-{os.environ['VEYR_CACHE_IMAGE']}-"
              f"{policy_hash}-{dependency_hash}-"
          )
          snapshot = (
              f"{prefix}{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}-"
              f"{os.environ['VEYR_CI_CONFIG']}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"prefix={prefix}\nkey={snapshot}\n")
          print(f"Conan cache compatibility prefix: {prefix}\nSnapshot key: {snapshot}")
          '@
          & $env:VEYR_BASE_PYTHON -B -c $keyScript
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore portable Conan package archive only (optimization)
        id: cache_restore
        if: ${{ success() && !inputs.cold_build }}
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .veyr-dev/conan-cache/dependencies.tgz
          key: ${{ steps.cache_keys.outputs.key }}
          restore-keys: ${{ steps.cache_keys.outputs.prefix }}
          enableCrossOsArchive: false

      - name: Import restored archive into the isolated Conan home
        id: cache_import
        if: ${{ success() && !inputs.cold_build && steps.cache_restore.outputs.cache-matched-key != '' }}
        env:
          VEYR_CONAN_EXECUTABLE: ${{ steps.doctor.outputs.conan }}
        run: |
          $archive = '.veyr-dev/conan-cache/dependencies.tgz'
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw 'Actions reported a restored Conan snapshot but its archive is missing; no retry.'
          }
          & $env:VEYR_CONAN_EXECUTABLE cache restore $archive 2>&1 | Tee-Object .veyr-dev/ci/cache-import.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Explicit Conan dependency setup (downloads/source builds allowed)
        id: dependencies
        run: |
          $start = Get-Date
          & $env:VEYR_BASE_PYTHON -B scripts/dev.py setup --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/setup.log
          $code = $LASTEXITCODE
          "setup_exit=$code elapsed_seconds=$(((Get-Date) - $start).TotalSeconds) cold_build=${{ inputs.cold_build }}" | Set-Content .veyr-dev/ci/setup-timing.txt
          # Runner memory/disk peaks are not measured by this wall-clock record; remain evidence gaps.
          if ($code -ne 0) { exit $code }

      - name: Check dependency integrity and export portable Conan archive
        id: export_cache
        if: ${{ success() && !inputs.cold_build && steps.dependencies.outcome == 'success' }}
        env:
          VEYR_CONAN_EXECUTABLE: ${{ steps.doctor.outputs.conan }}
        run: |
          & $env:VEYR_CONAN_EXECUTABLE cache check-integrity '*#*:*#*' 2>&1 | Tee-Object .veyr-dev/ci/cache-integrity.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force .veyr-dev/conan-cache | Out-Null
          & $env:VEYR_CONAN_EXECUTABLE cache save '*#*:*#*' --file .veyr-dev/conan-cache/dependencies.tgz 2>&1 | Tee-Object .veyr-dev/ci/cache-export.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save completed Conan package snapshot before project validation
        id: cache_save
        if: ${{ success() && !inputs.cold_build && steps.dependencies.outcome == 'success' && steps.export_cache.outcome == 'success' }}
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .veyr-dev/conan-cache/dependencies.tgz
          key: ${{ steps.cache_keys.outputs.key }}
          enableCrossOsArchive: false

      - name: Native cache-only configure
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/dev.py configure --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native incremental build
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/dev.py build --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native test
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/dev.py test --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/test.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Native verify
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/dev.py verify --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/verify.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Foundation prepared native acceptance
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/check_foundation.py --case prepared --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/foundation.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Foundation acquisition-disabled empty-cache rejection
        run: |
          & $env:VEYR_BASE_PYTHON -B scripts/check_foundation.py --case offline --environment $env:VEYR_CI_ENVIRONMENT --profile $env:VEYR_CI_PROFILE --config $env:VEYR_CI_CONFIG --conan-home $env:CONAN_HOME 2>&1 | Tee-Object .veyr-dev/ci/offline.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload observations, logs and native records (including failed bootstrap)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: foundation-${{ matrix.environment }}-${{ matrix.config }}-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            .veyr-dev/ci/
            build/**/compile_commands.json
            build/**/results.json
            build/**/Testing/Temporary/LastTest.log
            build/**/offline-rejection.log
